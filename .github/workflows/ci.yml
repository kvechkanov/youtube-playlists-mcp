name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check the npm tarball contains the compiled code
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            const missing = ["dist/index.js", "dist/server.js", "dist/auth-cli.js", "LICENSE", "README.md"]
              .filter((p) => !files.includes(p));
            if (missing.length) { console.error("Missing from tarball:", missing.join(", ")); process.exit(1); }
          '
